<!DOCTYPE html>
<html>
<head>
    <title>Order Placed!</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 500px; margin: 80px auto; background: white; border-radius: 8px; padding: 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        h1 { color: #27ae60; font-size: 28px; }
        p { color: #666; font-size: 16px; line-height: 1.6; }
        .btn { display: inline-block; background: #333; color: white; padding: 12px 30px; border-radius: 5px; text-decoration: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎉 Order Placed Successfully!</h1>
        <p>Thank you for your order! We'll process it shortly.</p>
        <a href="/" class="btn">Continue Shopping</a>
    </div>
</body>
</html>
