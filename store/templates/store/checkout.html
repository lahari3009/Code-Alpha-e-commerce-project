<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 15px; }
        .total { text-align: right; font-size: 22px; font-weight: bold; margin-top: 20px; color: #e44d26; }
        .btn { display: block; width: 100%; background: #27ae60; color: white; padding: 15px; border: none; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 20px; }
        .back { display: inline-block; margin-bottom: 20px; color: #333; text-decoration: none; font-size: 14px; }
        .summary { background: #f9f9f9; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/cart/" class="back">← Back to Cart</a>
        <h1>📦 Checkout</h1>
        <div class="summary">
            <h2>Order Summary</h2>
            {% for item in products %}
            <div class="item">
                <span>{{ item.product.name }} x {{ item.quantity }}</span>
                <span>₹{{ item.subtotal }}</span>
            </div>
            {% endfor %}
            <div class="total">Total: ₹{{ total }}</div>
        </div>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn">✅ Place Order</button>
        </form>
    </div>
</body>
</html>
