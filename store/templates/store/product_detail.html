<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 8px; padding: 30px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 8px; }
        h1 { color: #333; margin-top: 20px; }
        .price { color: #e44d26; font-size: 28px; font-weight: bold; }
        .description { color: #666; line-height: 1.6; margin: 15px 0; }
        .stock { color: green; font-size: 14px; }
        .btn { display: inline-block; background: #333; color: white; padding: 12px 30px; border-radius: 5px; text-decoration: none; margin-top: 15px; font-size: 16px; }
        .back { display: inline-block; margin-bottom: 20px; color: #333; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Back to Shop</a>
        {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="product-img">
        {% endif %}
        <h1>{{ product.name }}</h1>
        <p class="price">₹{{ product.price }}</p>
        <p class="stock">{{ product.stock }} items in stock</p>
        <p class="description">{{ product.description }}</p>
        <a href="/add-to-cart/{{ product.pk }}/" class="btn">Add to Cart</a>
    </div>
</body>
</html>
